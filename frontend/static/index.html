<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevSquad AI · Virtual Product & Engineering Team</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  :root {
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --bg: #0f172a;
    --card-bg: #1e293b;
    --border: #334155;
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: #1e293b;
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 700;
    font-size: 1.15rem;
  }
  .brand .tag {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.2rem 0.5rem;
    border-radius: 9999px;
    background: rgba(37, 99, 235, 0.2);
    color: #60a5fa;
    border: 1px solid rgba(96, 165, 250, 0.3);
  }
  .roles-badges {
    display: flex;
    gap: 0.4rem;
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .role-badge {
    padding: 0.2rem 0.45rem;
    border-radius: 4px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
  }
  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }
  .msg.agent {
    align-self: flex-start;
    align-items: flex-start;
  }
  .bubble {
    display: inline-block;
    padding: 0.85rem 1.15rem;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    line-height: 1.55;
    font-size: 0.95rem;
    white-space: pre-wrap;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }
  .msg.user .bubble {
    background: var(--accent);
    color: #fff;
    border: none;
    border-bottom-right-radius: 4px;
  }
  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }
  
  /* Quick Prompts */
  .quick-prompts {
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 0.4rem 1.5rem 0.2rem;
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
  }
  .prompt-btn {
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid var(--border);
    color: #cbd5e1;
    padding: 0.4rem 0.75rem;
    border-radius: 8px;
    font-size: 0.82rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .prompt-btn:hover {
    background: rgba(51, 65, 85, 0.9);
    border-color: #475569;
    color: #fff;
  }

  /* Form */
  form {
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 0.6rem;
    padding: 0.8rem 1.5rem 1.2rem;
  }
  input {
    flex: 1;
    padding: 0.8rem 1.1rem;
    background: #1e293b;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    color: #f8fafc;
    outline: none;
  }
  input:focus {
    border-color: var(--accent);
  }
  button#send-btn {
    padding: 0.8rem 1.4rem;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  button#send-btn:hover {
    background: var(--accent-hover);
  }

  /* A2UI Component Styles */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem;
    background: #1e293b;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; }
  .a2text.a2-h1 { font-size: 1.35rem; font-weight: 700; color: #60a5fa; }
  .a2text.a2-h2 { font-size: 1.15rem; font-weight: 700; color: #93c5fd; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: #94a3b8; }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 8px; display: block; border: 1px solid var(--border); margin-top: 0.4rem; }
  .material-symbols-outlined { font-size: 1.25rem; line-height: 1; vertical-align: middle; color: #60a5fa; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span>🤖 DevSquad AI</span>
    <span class="tag">Track 3</span>
  </div>
  <div class="roles-badges">
    <span class="role-badge">📋 PM</span>
    <span class="role-badge">🎨 Designer</span>
    <span class="role-badge">💻 Developer</span>
    <span class="role-badge">🧪 QA</span>
    <span class="role-badge">📊 Analyst</span>
  </div>
</header>

<div id="log"></div>

<div class="quick-prompts">
  <button class="prompt-btn" onclick="sendPrompt('Show our current project board and task statuses')">📋 Show project board</button>
  <button class="prompt-btn" onclick="sendPrompt('Designer: Generate a modern checkout screen UI mockup')">🎨 Design UI mockup</button>
  <button class="prompt-btn" onclick="sendPrompt('Developer: Check PyPI package details for fastapi')">💻 Check PyPI package</button>
  <button class="prompt-btn" onclick="sendPrompt('QA: Create a test plan for the payment webhook')">🧪 QA test plan</button>
</div>

<form id="form">
  <input id="input" placeholder="Collaborate with DevSquad AI (PM, Dev, Designer, QA, Analyst)…" autocomplete="off" autofocus>
  <button id="send-btn" type="submit">
    <span>Send</span>
    <span class="material-symbols-outlined" style="font-size:18px;color:#fff;">send</span>
  </button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit"));
}

/* --- A2UI Renderer Engine --- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  if (ch && Array.isArray(ch)) for (const c of ch) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) {
  return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase();
}

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card");
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col");
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "";
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined");
      s.textContent = iconName(boundStr(props.name) || props.name);
      return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) {
      const spec = comps[id];
      childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c));
    }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) {
    const node = buildNode(rid, comps, new Set());
    if (node) {
      container.appendChild(node);
      drew = true;
    }
  }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (!su || !Array.isArray(su.components)) continue;
    for (const c of su.components) {
      const txt = c && c.component && c.component.Text && c.component.Text.text;
      const s = boundStr(txt);
      if (s) out.push(s);
    }
  }
  return out.join("\n");
}

function formatMarkdown(text) {
  let html = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  // Direct image links [alt](url) where url ends with png/jpg/jpeg/webp
  html = html.replace(/\[([^\]]*)\]\((https?:\/\/[^\s\)]+\.(?:png|jpg|jpeg|webp))\)/gi, '<div class="img-preview" style="margin:8px 0;"><img src="$2" alt="$1" style="max-width:100%;max-height:360px;object-fit:cover;border-radius:8px;border:1px solid #334155;display:block;" /><a href="$2" target="_blank" style="color:#60a5fa;font-size:0.85rem;display:inline-block;margin-top:4px;text-decoration:underline;">$1 (Open Full Image ↗)</a></div>');

  // Standard Images: ![alt](url)
  html = html.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s\)]+)\)/g, '<div class="img-preview" style="margin:8px 0;"><img src="$2" alt="$1" style="max-width:100%;max-height:360px;object-fit:cover;border-radius:8px;border:1px solid #334155;display:block;" /></div>');

  // Standard Links: [text](url)
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s\)]+)\)/g, '<a href="$2" target="_blank" style="color:#60a5fa;text-decoration:underline;">$1 ↗</a>');

  // Bold: **text**
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  // Inline code: `code`
  html = html.replace(/`([^`]+)`/g, '<code style="background:#1e293b;padding:2px 6px;border-radius:4px;color:#93c5fd;font-family:monospace;font-size:0.9em;">$1</code>');

  // Bullet points
  html = html.replace(/^\*\s+(.+)$/gm, '• $1');

  // Newlines
  html = html.replace(/\n/g, '<br>');

  return html;
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n\n").trim();
  if (textStr) {
    const textEl = el("div", "markdown-body");
    textEl.innerHTML = formatMarkdown(textStr);
    b.appendChild(textEl);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) {
      b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
    }
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// Submit handler
form.addEventListener("submit", async ev => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent");
  b.textContent = "DevSquad AI is thinking…";

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const raw = await res.text();
    let data;
    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error(`Server returned non-JSON (HTTP ${res.status}): ${raw.slice(0, 200)}`);
    }
    const parts = data.parts || (data.reply && data.reply.parts) || [];
    renderReply(b, parts);
  } catch (err) {
    b.textContent = "Error: " + err.message;
  }
});

// Welcome message
window.addEventListener("DOMContentLoaded", () => {
  const b = bubble("agent");
  b.textContent = "👋 Welcome to DevSquad AI! I'm your collaborative product & engineering team (PM, Designer, Developer, QA, Analyst).\n\nAsk me to review sprint tasks, generate UI designs, inspect libraries, or draft specs!";
});
</script>
</body>
</html>
